name: Keep the app awake

# Streamlit Community Cloud sleeps apps after 12 hours without visitors.
# Visit every 4 hours (GitHub can delay scheduled runs, so stay well under 12).
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch: {}  # "Run workflow" button in the Actions tab

permissions:
  contents: read

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
      - name: Visit the app
        run: python scripts/keep_awake.py https://reapers-stats.streamlit.app/
      - name: Upload screenshot if it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keep-awake-failure
          path: keep-awake-failure.png
          if-no-files-found: ignore
